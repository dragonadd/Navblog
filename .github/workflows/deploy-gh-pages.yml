# 推送到 main 分支（包括后台保存文章产生的提交）后自动构建并部署到 GitHub Pages。
# 使用前：仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"。
# 子路径（https://<user>.github.io/<repo>/）与站点地址会自动识别，无需手动修改 baseHref。
# 若使用 Netlify / Vercel / Cloudflare Pages 部署，可删除本文件。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          BLOG_BASE_HREF: ${{ steps.pages.outputs.base_path }}/
          BLOG_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
