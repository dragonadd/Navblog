# 博客基础配置（构建时读取，修改后需要重新构建）
# 仓库地址：支持 GitHub / Gitee / GitLab
#   GitHub: https://github.com/<用户名>/<仓库名>
#   Gitee:  https://gitee.com/<用户名>/<仓库名>
#   GitLab: https://gitlab.com/<用户名>/<仓库名>  (可选 ?projectId=123)
gitRepoUrl: https://github.com/dragonadd/nav1

# 文章/设置所在分支（后台保存时提交到这个分支）
branch: main

# 图片存放仓库，?branch= 指定分支（不存在会自动创建空分支，仅 GitHub）
# 留空则使用 gitRepoUrl 的 image 分支
imageRepoUrl: https://github.com/dragonadd/nav1?branch=images

# 站点正式访问地址（用于 sitemap / RSS / canonical / 版权链接），末尾不要带 /
siteUrl: https://example.com

# 站点部署的子路径，例如 GitHub Pages 项目页 https://user.github.io/repo/ 填 /repo/
# Netlify / Vercel / Cloudflare Pages / 自定义域名 保持 /
baseHref: /
